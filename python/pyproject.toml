[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "cleon"
version = "0.1.15"
description = "A Genetic Dynasty of Agentic Clones for Jupyter Notebooks"
requires-python = ">=3.9"
dependencies = [
    "ipython>=8.0",
    "websocket-client>=1.6",
    "cleon-jupyter-extension>=0.1.0",
]
authors = [{ name = "Madhava Jay", email = "me@madhavajay.com" }]
keywords = ["codex", "cleon", "ipython"]
readme = "README.md"
urls = { Homepage = "https://github.com/madhavajay/cleon", Repository = "https://github.com/madhavajay/cleon" }
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
cleon = "cleon.cli:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "cleon._native"
python-source = "src"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["types-pygments>=2.19.0.20251121"]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "cleon._native"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cleon._native.*"
ignore_missing_imports = true

[project.optional-dependencies]
# This extra is a no-op placeholder to signal an install without Jupyter/extension
no-jupyter = []
jupyter = [
    "jupyterlab>=4",
]
